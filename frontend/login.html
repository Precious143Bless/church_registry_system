<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Login | Church Registry System</title>
    <link href="assets/style/bootstrap.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/style/church-registry.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="login-container">
        <div class="login-card fade-in">
            <div class="login-header">
                <div class="login-logo"><i class="fas fa-church"></i></div>
                <h1 class="login-title">Church Registry</h1>
                <p class="login-subtitle">Sign in to manage parish records</p>
            </div>
            
            <form id="loginForm">
                <div class="form-group mb-4">
                    <label class="form-label" for="email">Email Address</label>
                    <input type="email" class="form-control" id="email" placeholder="Enter your email" required>
                </div>
                
                <div class="form-group mb-4">
                    <label class="form-label" for="password">Password</label>
                    <input type="password" class="form-control" id="password" placeholder="Enter your password" required>
                </div>
                
                <div class="form-group mb-4">
                    <div class="d-flex justify-content-between align-items-center">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="remember">
                            <label class="form-check-label" for="remember" style="font-size: 0.875rem; cursor: pointer;">
                                Remember me
                            </label>
                        </div>
                        <a href="#" style="color: var(--gray-900); text-decoration: none; font-size: 0.875rem; font-weight: 500;">Forgot password?</a>
                    </div>
                </div>
                
                <button type="submit" class="btn btn-primary w-100 mb-4" style="height: 52px; font-weight: 600;">
                    Sign In
                </button>
                
                <div class="text-center">
                    <p style="font-size: 0.875rem; color: var(--gray-600);">
                        Don't have an account? <a href="#" style="color: var(--gray-900); text-decoration: none; font-weight: 500;">Contact administrator</a>
                    </p>
                </div>
            </form>
        </div>
    </div>
    
    <script src="assets/script/bootstrap.bundle.js"></script>
    <script src="assets/script/church-registry.js"></script>
</body>
</html>
