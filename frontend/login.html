<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Login | Church Registry System</title>
    <link href="assets/style/bootstrap.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/style/church-registry.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="login-container">
        <div class="login-card fade-in">
            <div class="login-header">
                <div class="login-logo"><i class="fas fa-church"></i></div>
                <h1 class="login-title">Church Registry</h1>
                <p class="login-subtitle">Sign in to manage parish records</p>
            </div>
            
            <form id="loginForm">
                <div class="form-group mb-4">
                    <label class="form-label" for="userType">Login As</label>
                    <select class="form-control" id="userType" required>
                        <option value="">Select User Type</option>
                        <option value="admin">System Administrator</option>
                        <option value="priest">Priest/Pastor</option>
                        <option value="secretary">Church Secretary</option>
                        <option value="staff">Church Staff</option>
                        <option value="volunteer">Volunteer</option>
                    </select>
                </div>
                
                <div class="form-group mb-4">
                    <label class="form-label" for="email">Email Address</label>
                    <input type="email" class="form-control" id="email" placeholder="Enter your email" required>
                </div>
                
                <div class="form-group mb-4">
                    <label class="form-label" for="password">Password</label>
                    <input type="password" class="form-control" id="password" placeholder="Enter your password" required>
                </div>
                
                <div class="form-group mb-4">
                    <div class="d-flex justify-content-between align-items-center">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="remember">
                            <label class="form-check-label" for="remember" style="font-size: 0.875rem; cursor: pointer;">
                                Remember me
                            </label>
                        </div>
                        <a href="#" style="color: var(--gray-900); text-decoration: none; font-size: 0.875rem; font-weight: 500;">Forgot password?</a>
                    </div>
                </div>
                
                <button type="submit" class="btn btn-primary w-100 mb-4" style="height: 52px; font-weight: 600;">
                    Sign In
                </button>
                
                <div class="text-center">
                    <p style="font-size: 0.875rem; color: var(--gray-600);">
                        Don't have an account? <a href="#" onclick="showRegisterModal()" style="color: var(--primary-color); text-decoration: none; font-weight: 500;">Register here</a>
                    </p>
                </div>
            </form>
        </div>
    </div>
    
    <!-- Register Modal -->
    <div id="registerModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 2000; align-items: center; justify-content: center;">
        <div style="background: white; border-radius: var(--radius-lg); width: 90%; max-width: 500px; max-height: 90vh; overflow-y: auto;">
            <div class="card-header d-flex justify-content-between align-items-center" style="border-bottom: 1px solid var(--border-color); padding: 1.5rem;">
                <h2 style="font-size: 1.25rem; margin: 0; font-weight: 600;">Create Account</h2>
                <button onclick="hideRegisterModal()" style="background: none; border: none; font-size: 1.5rem; cursor: pointer; color: var(--gray-500);"><i class="fas fa-times"></i></button>
            </div>
            <div class="card-body" style="padding: 1.5rem;">
                <form id="registerForm">
                    <div class="form-group mb-3">
                        <label class="form-label" for="regFirstName">First Name *</label>
                        <input type="text" class="form-control" id="regFirstName" placeholder="Enter your first name" required>
                    </div>
                    
                    <div class="form-group mb-3">
                        <label class="form-label" for="regLastName">Last Name *</label>
                        <input type="text" class="form-control" id="regLastName" placeholder="Enter your last name" required>
                    </div>
                    
                    <div class="form-group mb-3">
                        <label class="form-label" for="regEmail">Email Address *</label>
                        <input type="email" class="form-control" id="regEmail" placeholder="Enter your email" required>
                    </div>
                    
                    <div class="form-group mb-3">
                        <label class="form-label" for="regPassword">Password *</label>
                        <input type="password" class="form-control" id="regPassword" placeholder="Create a password" required>
                    </div>
                    
                    <div class="form-group mb-3">
                        <label class="form-label" for="regConfirmPassword">Confirm Password *</label>
                        <input type="password" class="form-control" id="regConfirmPassword" placeholder="Confirm your password" required>
                    </div>
                    
                    <div class="form-group mb-3">
                        <label class="form-label" for="regUserType">Account Type *</label>
                        <select class="form-control" id="regUserType" required>
                            <option value="">Select Account Type</option>
                            <option value="volunteer">Volunteer</option>
                            <option value="staff">Church Staff</option>
                            <option value="secretary">Church Secretary</option>
                        </select>
                    </div>
                    
                    <div class="form-group mb-3">
                        <label class="form-label" for="regPhone">Phone Number</label>
                        <input type="tel" class="form-control" id="regPhone" placeholder="Enter your phone number">
                    </div>
                    
                    <div class="form-group mb-4">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="regTerms" required>
                            <label class="form-check-label" for="regTerms" style="font-size: 0.875rem; cursor: pointer;">
                                I agree to the <a href="#" style="color: var(--primary-color);">Terms and Conditions</a>
                            </label>
                        </div>
                    </div>
                    
                    <button type="submit" class="btn btn-primary w-100" style="height: 48px; font-weight: 600;">
                        Create Account
                    </button>
                    
                    <div class="text-center mt-3">
                        <p style="font-size: 0.875rem; color: var(--gray-600);">
                            Already have an account? <a href="#" onclick="hideRegisterModal()" style="color: var(--primary-color); text-decoration: none; font-weight: 500;">Sign in</a>
                        </p>
                    </div>
                </form>
            </div>
        </div>
    </div>
    
    <script src="assets/script/bootstrap.bundle.js"></script>
    <script src="assets/script/church-registry.js"></script>
</body>
</html>
